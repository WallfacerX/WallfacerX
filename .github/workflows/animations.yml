name: Update profile animations
on:
  push:
    paths:
      - 'scripts/generate_animations.py'
      - '.github/workflows/animations.yml'
  schedule:
    - cron: '37 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-animations
  cancel-in-progress: false
jobs:
  animations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; reviewed action.yml
        with:
          ref: main
      - name: Generate animations from GitHub contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_animations.py
      - name: Publish generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/digital-rain*.svg assets/contribution-arcade*.svg assets/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution arcade and profile animations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
